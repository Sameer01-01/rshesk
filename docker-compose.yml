services:
  # Primary Unified Production Service (FastAPI + React SPA)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wind-forecast-monitor
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DEFAULT_CUTOFF_HOUR=9
      - CORS_ORIGINS=*
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
